<h2>Anwesenheit nachtragen</h2>

<p>{{ student.name }}</p>

<form method="post">
    {% csrf_token %}

    <p>
        Kommen:
        <input type="time" name="check_in">
    </p>

    <p>
        Gehen:
        <input type="time" name="check_out">
    </p>
    <p>
        Tagesnotiz:
    </p>

    <textarea
        name="daily_note"
        rows="3"
        cols="40"
    ></textarea>

    <button type="submit">
        Speichern
    </button>
</form>
